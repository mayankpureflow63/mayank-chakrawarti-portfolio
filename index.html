                    <i data-lucide="linkedin" className="w-4 h-4"></i>
                  </a>

                  <a
                    href={`mailto:${contactData.primaryEmail}`}
                    className="w-8 h-8 rounded-xl bg-white border border-[#DDD6FE] flex items-center justify-center text-[#6D4BD8] hover:bg-[#F3EFFF] hover:scale-105 transition-all shadow-2xs"
                    title="Email"
                  >
                    <i data-lucide="mail" className="w-4 h-4"></i>
                  </a>

                  <a
                    href="https://wa.me/916388779272"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-8 h-8 rounded-xl bg-white border border-[#DDD6FE] flex items-center justify-center text-emerald-500 hover:bg-emerald-50 hover:scale-105 transition-all shadow-2xs"
                    title="WhatsApp"
                  >
                    <i data-lucide="message-circle" className="w-4 h-4"></i>
                  </a>
                </div>

                {/* Right Side: Portfolio Label + Back to Top */}
                <div className="flex items-center gap-3">
                  <span className="text-[11px] text-[#64748B] hidden lg:inline">
                    Human Resources & Talent Acquisition Portfolio
                  </span>

                  <button
                    onClick={scrollToTop}
                    className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white hover:bg-[#F3EFFF] border border-[#DDD6FE] text-[#6D4BD8] text-xs font-bold shadow-2xs hover:shadow-sm transition-all cursor-pointer"
                    title="Back to Top"
                  >
                    <i data-lucide="arrow-up" className="w-3.5 h-3.5"></i>
                    <span>Back to Top</span>
                  </button>
                </div>

              </div>

            </div>

          </footer>

        </div>
      );
    };

    // Main App Component
    const App = () => {
      const [toastMessage, setToastMessage] = useState(null);

      const handleCopyText = (text, label) => {
        if (text && navigator.clipboard) {
          navigator.clipboard.writeText(text);
          setToastMessage(`${label} copied to clipboard!`);
        } else {
          setToastMessage(label);
        }

        setTimeout(() => {
          setToastMessage(null);
        }, 3200);
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [toastMessage]);

      return (
        <div className="min-h-screen bg-[#F8F8FC] text-[#151B2E] font-sans selection:bg-[#7C4DDB] selection:text-white relative overflow-x-hidden">
          <Navbar />

          <main>
            <Hero onCopyText={handleCopyText} />
            <About />
            <Experience />
            <Skills />
            <Education />
          </main>

          <ContactFooter onCopyText={handleCopyText} />

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#111625] text-white px-5 py-3.5 rounded-2xl border border-purpleBrand-400/50 shadow-2xl flex items-center gap-3 backdrop-blur-md">
              <i data-lucide="check-circle-2" className="w-5 h-5 text-purpleBrand-400 flex-shrink-0"></i>
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
